<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Title }} | {{ .Site.Title }}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; line-height: 1.7; color: #1f2937; background: #f9fafb; padding: 2rem 1rem; }
    main { max-width: 680px; margin: 0 auto; background: #fff; padding: 2.5rem; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .back { display: inline-block; margin-bottom: 1.5rem; color: #2563eb; text-decoration: none; font-size: 0.95rem; font-weight: 500; }
    .back:hover { text-decoration: underline; }
    h1 { font-size: 1.85rem; color: #111827; margin-bottom: 0.4rem; line-height: 1.3; }
    time { display: block; font-size: 0.875rem; color: #6b7280; margin-bottom: 1.75rem; padding-bottom: 1.25rem; border-bottom: 1px solid #e5e7eb; }
    article p { margin-bottom: 1rem; }
    article ul, article ol { margin: 0 0 1rem 1.5rem; }
    article a { color: #2563eb; }
  </style>
</head>
<body>
  <main>
    <a class="back" href="{{ .Site.Home.RelPermalink }}">&larr; Anasayfaya Dön</a>
    <article>
      <h1>{{ .Title }}</h1>
      {{ if not .Date.IsZero }}
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "02.01.2006" }}</time>
      {{ end }}
      <div class="content">
        {{ .Content }}
      </div>
    </article>
  </main>
</body>
</html>
